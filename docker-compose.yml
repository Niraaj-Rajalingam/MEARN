services:
  mearn:
    image: mearn-image
    container_name: mearn
    build:
      context: .
      dockerfile: ./Dockerfile
    depends_on:
      pg-db:
        condition: service_healthy
        restart: true
    command: ["npm", "run", "dev"]
    ports:
      - "3000:3000"
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore: # by default includes .dockerignores
            - package-lock.json
    environment:
      - NODE_ENV=development

  pg-db:
    image: postgres:17
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - pg-db-data:/var/lib/postgresql/data
    environment:
      - PGUSER=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mearn-app-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 1s
      timeout: 5s
      retries: 3

volumes:
  pg-db-data:
    name: "pg-db-data"
